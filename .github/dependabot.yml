version: 2
updates:
  # The root pom aggregates lilo and lilo-spring, so "/" covers them; listing the
  # modules separately would open duplicate PRs. /samples is a separate aggregator.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: [ minor, patch ]
  - package-ecosystem: maven
    directory: "/samples"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: [ minor, patch ]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]
