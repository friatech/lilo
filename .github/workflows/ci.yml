name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lilo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven, SpotBugs and format check
        run: mvn -B -ntp verify com.spotify.fmt:fmt-maven-plugin:check -Dgpg.skip

  # Runs the lilo core tests on a real JDK 11 (the module targets Java 11). Maven and the
  # compiler run on JDK 21 (--release 11); only surefire's forked test JVM is JDK 11.
  # Maven itself runs on 21, so the enforcer rule would pass; it is skipped here because
  # this job is only about the test runtime.
  test-lilo-jdk11:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 11 (test runtime)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up JDK 21 (Maven and compiler)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Test lilo on JDK 11
        run: mvn -B -ntp -pl lilo test -Dgpg.skip -Dspotbugs.skip -Dcheckstyle.skip -Dfmt.skip -Denforcer.skip -Djvm="$JAVA_HOME_11_X64/bin/java"

  check-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build lilo and cache
        run: mvn -B -ntp clean install -DskipTests -Dgpg.skip -Dcheckstyle.skip -Dspotbugs.skip -Denforcer.skip -Dmaven.javadoc.skip -Dmaven.source.skip

      - name: Check lilo samples
        run: cd samples && mvn -B -ntp verify -Dspotbugs.skip com.spotify.fmt:fmt-maven-plugin:check
