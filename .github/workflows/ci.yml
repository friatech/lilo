name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-lilo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven, SpotBugs and format check
        run: mvn -B -ntp verify com.spotify.fmt:fmt-maven-plugin:check -Denforcer.skip -Dgpg.skip

  check-samples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build lilo and cache
        run: mvn -B -ntp clean install -DskipTests -Dgpg.skip -Dcheckstyle.skip -Dspotbugs.skip -Denforcer.skip -Dmaven.javadoc.skip -Dmaven.source.skip

      - name: Check lilo samples
        run: cd samples && mvn -B -ntp compile com.spotify.fmt:fmt-maven-plugin:check
